<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GWT Bootstrap 5 Modern Showcase</title>
  <script src="GwtBootstrap5Showcase/GwtBootstrap5Showcase.nocache.js"></script>
  <style>
    body {
      padding-top: 72px;
    }

    .gbm-showcase {
      padding-bottom: 3rem;
    }

    .gbm-example-body > * {
      margin-right: .5rem;
      margin-bottom: .5rem;
    }

    .gbm-inline-demo {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .5rem;
    }

    .gbm-inline-demo .card,
    .gbm-inline-demo .list-group,
    .gbm-inline-demo .navbar,
    .gbm-inline-demo .progress,
    .gbm-inline-demo .vstack {
      width: 100%;
    }

    pre {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="showcase"></div>
</body>
</html>
