<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GWT Bootstrap 5 Modern Showcase</title>
  <script src="GwtBootstrap5Showcase/GwtBootstrap5Showcase.nocache.js"></script>
  <style>
    body {
      padding-top: 72px;
    }

    .gbm-showcase {
      max-width: 1170px;
      padding-top: 1rem;
      padding-bottom: 3rem;
    }

    .navbar > .container {
      max-width: 1170px;
    }

    .gbm-example-body > * {
      margin-right: .5rem;
      margin-bottom: .5rem;
    }

    .gbm-inline-demo {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .5rem;
    }

    .gbm-inline-demo .card,
    .gbm-inline-demo .list-group,
    .gbm-inline-demo .navbar,
    .gbm-inline-demo .progress,
    .gbm-inline-demo .vstack {
      width: 100%;
    }

    .gbm-stacked-demo {
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    .gbm-stacked-demo .card,
    .gbm-stacked-demo .list-group,
    .gbm-stacked-demo .navbar,
    .gbm-stacked-demo .progress,
    .gbm-stacked-demo .vstack {
      width: 100%;
    }

    .gbm-inline-demo img,
    .gbm-stacked-demo img {
      max-width: 12rem;
    }

    pre {
      white-space: pre-wrap;
    }

    @media (max-width: 575.98px) {
      body {
        padding-top: 56px;
      }

      .gbm-showcase {
        padding-left: 15px;
        padding-right: 15px;
      }

      .gbm-showcase .p-5 {
        padding: 1.5rem !important;
      }
    }
  </style>
</head>
<body>
  <div id="showcase"></div>
</body>
</html>
