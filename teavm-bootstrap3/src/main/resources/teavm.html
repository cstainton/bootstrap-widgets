<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeaVM Bootstrap 3</title>
  <!--
    Themes adopts the link with this id rather than adding a second stylesheet,
    so the runtime theme switcher performs a single atomic swap. Keep the id.
  -->
  <link id="gwtbootstrap3-theme" rel="stylesheet" href="bootstrap/bootstrap-3.4.1.min.cache.css">
</head>
<body>
  <nav class="navbar navbar-default navbar-static-top">
    <div class="container">
      <div class="navbar-header"><span class="navbar-brand">Bootstrap 3 &middot; TeaVM</span></div>
      <ul class="nav navbar-nav">
        <li><a href="./">Bootstrap 3 Showcase (GWT)</a></li>
        <li><a href="bootstrap5/">Bootstrap 5 Showcase (GWT)</a></li>
        <li><a href="teavm-bootstrap5.html">Bootstrap 5 Showcase (TeaVM)</a></li>
        <li><a href="https://github.com/cstainton/gwtbootstrap">Fork on GitHub</a></li>
      </ul>
    </div>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
  <script>window.exports = window;</script>
  <script src="teavm/teavm-bootstrap3-smoke.js"></script>
  <script>
    const teavmMain = window.main || (window.exports && window.exports.main);
    if (typeof teavmMain === 'function') {
      teavmMain([]);
    } else {
      document.body.innerHTML = '<main class="container py-4"><div class="alert alert-danger">TeaVM entry point was not exported.</div></main>';
    }
  </script>
</body>
</html>
