<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeaVM Bootstrap 3 Modern</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
  <script>window.exports = window;</script>
  <script src="teavm/teavm-bootstrap3-modern-smoke.js"></script>
  <script>
    const teavmMain = window.main || (window.exports && window.exports.main);
    if (typeof teavmMain === 'function') {
      teavmMain([]);
    } else {
      document.body.innerHTML = '<main class="container py-4"><div class="alert alert-danger">TeaVM entry point was not exported.</div></main>';
    }
  </script>
</body>
</html>
