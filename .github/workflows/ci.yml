name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Maven build and showcase compile
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check showcase code samples
        run: python3 scripts/check-showcase-samples.py

      - name: Check module layout and shared-source seams
        run: python3 scripts/check-module-layout.py

      - name: Build and install reactor artifacts
        run: mvn -B -DskipTests install

      - name: Run compatibility and widget browser tests
        run: mvn -B -pl :gwt-user-jvm-contract-tests,:gwt-bootstrap-widget-tests,:teavm-gwt-compat-contracts,:teavm-bootstrap3-tests,:teavm-bootstrap5-tests -am test

      - name: Compile showcase with GWT
        run: mvn -B -f gwt/gwt-bootstrap3-showcase/pom.xml -DskipTests -Dgwt.forceCompilation=true gwt:compile

      - name: Compile Bootstrap 5 showcase with GWT
        run: mvn -B -f gwt/gwt-bootstrap5-showcase/pom.xml -DskipTests -Dgwt.forceCompilation=true gwt:compile

      - name: Verify published source maps and source JARs
        run: python3 scripts/prepare-showcase-debug-artifacts.py

      - name: Assemble verified showcase site
        run: bash scripts/assemble-pages.sh

      - name: Smoke-test assembled showcases in Chromium
        run: bash scripts/smoke-showcase-pages.sh

      - name: Upload verified showcase site
        uses: actions/upload-artifact@v4
        with:
          name: showcase-pages
          path: target/pages
          if-no-files-found: error
          retention-days: 7

      - name: Dependency audit
        run: mvn -B -Pdependency-audit -Dmaven.test.skip=true -DskipTests verify
