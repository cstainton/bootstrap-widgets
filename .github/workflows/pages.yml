name: Showcase Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build showcase site
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install library artifacts
        run: mvn -B -DskipTests install

      - name: Compile showcase
        run: mvn -B -f gwt-bootstrap3-modern-showcase/pom.xml -DskipTests -Dgwt.forceCompilation=true gwt:compile

      - name: Compile Bootstrap 5 showcase
        run: mvn -B -f gwt-bootstrap5-modern-showcase/pom.xml -DskipTests -Dgwt.forceCompilation=true gwt:compile

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          showcase_dir="$(find gwt-bootstrap3-modern-showcase/target -maxdepth 1 -type d -name 'gwt-bootstrap3-modern-showcase-*' | head -1)"
          bootstrap5_showcase_dir="$(find gwt-bootstrap5-modern-showcase/target -maxdepth 1 -type d -name 'gwt-bootstrap5-modern-showcase-*' | head -1)"
          mkdir -p public
          cp -R "${showcase_dir}/"* public/
          if [ -f public/GwtBootstrap3Demo.html ]; then cp public/GwtBootstrap3Demo.html public/showcase.html; fi
          mkdir -p public/bootstrap5
          cp -R "${bootstrap5_showcase_dir}/"* public/bootstrap5/
          mkdir -p public/teavm
          cp -R teavm-bootstrap3-modern/target/teavm/* public/teavm/
          cp teavm-bootstrap3-modern/src/main/resources/teavm.html public/teavm.html
          mkdir -p public/teavm5
          cp -R teavm-bootstrap5-modern/target/teavm/* public/teavm5/
          cp teavm-bootstrap5-modern/src/main/resources/teavm-bootstrap5.html public/teavm-bootstrap5.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy showcase
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
