name: Showcase Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build showcase site
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install library artifacts
        run: mvn -B -DskipTests install

      - name: Compile showcase
        run: mvn -B -f gwtbootstrap3-showcase/pom.xml -DskipTests -Dgwt.forceCompilation=true gwt:compile

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          showcase_dir="$(find gwtbootstrap3-showcase/target -maxdepth 1 -type d -name 'gwtbootstrap3-showcase-*' | head -1)"
          mkdir -p public
          cp -R "${showcase_dir}/"* public/
          cp public/GwtBootstrap3Demo.html public/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy showcase
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
