name: Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: OWASP dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run dependency audit
        run: mvn -B -Pdependency-audit -Dmaven.test.skip=true -DskipTests -DnvdApiKey="${NVD_API_KEY}" verify
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # Maven properties are not populated automatically from environment variables.
        # settings.xml may supply nvdApiKey; otherwise pass the repository secret explicitly.

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: '**/target/dependency-check-report.*'
          if-no-files-found: warn
          retention-days: 30
